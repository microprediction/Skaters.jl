name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Julia-written checkpoints must resume in the Python reference
  # (parity/write_julia_checkpoints.jl, then parity/check_julia_checkpoints.py).
  # The reference is rebuilt exactly as the parity vectors were made:
  # skaters feat/canonical-state (skaters#394, which already merges main and
  # so #392 and #393) with fix/spliced-tail-z's tails.py applied (skaters#398).
  # TODO: once skaters#394 and #398 merge, check out the skaters main commit
  # that carries both instead of rebuilding the tree here.
  state-in-python:
    runs-on: ubuntu-latest
    env:
      SKATERS_CANONICAL_STATE: cdab5cad450026910752c025f19c7eadc75a6125   # skaters#394
      SKATERS_TAIL_Z: e00e03823df776201c6782fb47012373fda8c3f7            # skaters#398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microprediction/skaters
          path: skaters-ref
          fetch-depth: 0
      - name: Build the reference tree
        working-directory: skaters-ref
        run: |
          git checkout --detach "$SKATERS_CANONICAL_STATE"
          git diff "$SKATERS_TAIL_Z^" "$SKATERS_TAIL_Z" -- src/skaters/tails.py | git apply
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Write Julia checkpoints
        run: julia --project=. parity/write_julia_checkpoints.jl "$RUNNER_TEMP/julia_checkpoints.json"
      - name: Resume them in Python
        env:
          PYTHONPATH: skaters-ref/src
        run: python parity/check_julia_checkpoints.py "$RUNNER_TEMP/julia_checkpoints.json"
