name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Julia-written checkpoints must resume in the Python reference
  # (parity/write_julia_checkpoints.jl, then parity/check_julia_checkpoints.py).
  # The reference is the skaters main commit that merged skaters#398,
  # which carries the canonical state layout (#394) and the deep-tail fix.
  state-in-python:
    runs-on: ubuntu-latest
    env:
      SKATERS_REF: 3b9f5a789a2ebff4591570ea8cb2fc0f961e8bc9   # skaters main, merge of #398
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microprediction/skaters
          path: skaters-ref
          fetch-depth: 0
      - name: Check out the reference
        working-directory: skaters-ref
        run: |
          git checkout --detach "$SKATERS_REF"
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Write Julia checkpoints
        run: julia --project=. parity/write_julia_checkpoints.jl "$RUNNER_TEMP/julia_checkpoints.json"
      - name: Resume them in Python
        env:
          PYTHONPATH: skaters-ref/src
        run: python parity/check_julia_checkpoints.py "$RUNNER_TEMP/julia_checkpoints.json"
